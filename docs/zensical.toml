[project]
site_name = "Universidad"
site_url = ""
site_description = "Uni docs"
repo_name = "migueel15/universidad"
repo_url = "https://github.com/migueel15/Universidad"
docs_dir = "src"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/shortcuts.js",
  "javascripts/mathjax.js",
  "javascripts/pwa.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.markdown_extensions]
pymdownx.arithmatex.generic = true

[project.theme.icon]
logo = "lucide/graduation-cap"
repo = "fontawesome/brands/github"

[project.theme]
custom_dir = "overrides"
variant = "modern"
font.text = "Inter"
font.code = "JetBrains Mono"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Activar tema claro"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Activar tema oscuro"

[project.extra]
generator = false
